#
# Only the blocks below are read. `Config` in backend/cmd/api/main.go unmarshals exactly
# `server`, `database` and `zitadel`; anything else in this file is silently discarded.
# Every value here is also overridable by environment variable (see applyEnvOverrides), which is
# how the containers and Kubernetes pods configure themselves - the file is the local-run default.
#
# Deliberately NOT here, because nothing would read it:
#   redis   -> REDIS_HOST / REDIS_PORT, defaulting to localhost:6379 in code
#   storage -> core/storage.ConfigFromEnv() (STORAGE_ENDPOINT, default localhost:3900 for Garage)
#   logging -> LOG_LEVEL
#   crypto  -> ENCRYPTION_KEY

server:
  host: "0.0.0.0"
  port: 8022
  read_timeout: 30s
  write_timeout: 30s

database:
  host: "localhost"
  port: 5432
  user: "iac"
  password: "iac_password"
  dbname: "iac_platform"
  sslmode: "disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m

zitadel:
  issuer: "http://localhost:8080" # Read from ZITADEL_ISSUER environment variable (fallback)
  client_id: "" # Read from ZITADEL_API_CLIENT_ID environment variable
  client_secret: "" # Read from ZITADEL_API_CLIENT_SECRET environment variable
